services:
  postgres:
    image: postgres:16
    container_name: writewisely-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: writewisely
      POSTGRES_PASSWORD: writewisely
      POSTGRES_DB: writewisely
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U writewisely -d writewisely"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
