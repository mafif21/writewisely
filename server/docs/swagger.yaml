basePath: /api/v1
definitions:
  server.HealthResponse:
    properties:
      db:
        description: 'Database connectivity: "up" or "down".'
        enum:
        - up
        - down
        example: up
        type: string
      status:
        description: '"ok" when every dependency is up, "degraded" otherwise.'
        enum:
        - ok
        - degraded
        example: ok
        type: string
    required:
    - db
    - status
    type: object
info:
  contact: {}
  description: AI-powered IELTS Writing checker (Task 1 Academic and Task 2).
  title: WriteWisely API
  version: 0.1.0
paths:
  /health:
    get:
      consumes:
      - application/json
      description: Reports API status and database connectivity. Returns 503 with
        db "down" when the database ping fails.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/server.HealthResponse'
      summary: Health check
      tags:
      - health
swagger: "2.0"
